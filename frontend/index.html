<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0052A4" />
    <meta name="description" content="모임 중 지금 어디에 있어야 집에 갈 수 있는지 지도 위 자기장으로 보여주는 귀가 도우미" />
    <title>막차 자기장</title>

    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <!-- 홈: 내 카운트다운 + 내 자기장 -->
    <main class="page">
      <header class="topbar">
        <h1>🚇 막차 자기장</h1>
        <a href="/html/settings.html" class="icon-btn" aria-label="설정">⚙️</a>
      </header>

      <div id="countdown" class="countdown" aria-live="polite">
        <p class="countdown-label">집에 가려면 일어나야 하는 시각까지</p>
        <p class="countdown-time" id="countdown-time">--:--:--</p>
        <p class="countdown-sub" id="countdown-sub">위치를 불러오는 중…</p>
      </div>

      <div id="zone-map" class="map" role="img" aria-label="막차 자기장 지도"></div>

      <div id="route-card" class="card" hidden></div>
      <div id="taxi-meter" class="card" hidden></div>

      <nav class="actions">
        <a href="/html/join.html" class="btn">초대 코드로 입장</a>
        <button type="button" class="btn btn-primary" id="btn-create-room">모임방 만들기</button>
      </nav>
    </main>

    <script type="module" src="/src/home.js"></script>
  </body>
</html>
