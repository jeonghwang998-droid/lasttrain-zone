<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="막차 자기장" />
    <title>회원가입 · 막차 자기장</title>
    <link rel="manifest" href="../public/manifest.webmanifest" />
    <link rel="icon" href="../public/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../public/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body>
    <main class="page auth">
      <a href="./login.html" class="icon-btn back" aria-label="뒤로">←</a>

      <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">🚇</div>
        <h1>회원가입</h1>
        <p>모임방과 알림을 쓰려면 계정이 필요해요</p>
      </div>

      <form id="signup-form" class="form" novalidate>
        <label>
          닉네임
          <input type="text" name="nickname" maxlength="12" autocomplete="nickname" placeholder="모임에서 보이는 이름" required />
        </label>
        <label>
          이메일
          <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required />
        </label>
        <label>
          비밀번호
          <input type="password" name="password" autocomplete="new-password" placeholder="6자 이상" required />
        </label>
        <label>
          비밀번호 확인
          <input type="password" name="password2" autocomplete="new-password" required />
        </label>
        <label class="check">
          <input type="checkbox" name="agree" required />
          <span>이용약관과 개인정보 처리방침에 동의합니다. 집 위치는 다른 멤버에게 공개되지 않아요.</span>
        </label>
        <p class="err" id="signup-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block">가입하기</button>
      </form>

      <p class="auth-switch">이미 계정이 있나요? <a href="./login.html">로그인</a></p>
    </main>

    <script type="module" src="../src/js/signup.js"></script>
  </body>
</html>
