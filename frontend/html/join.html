<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="막차 자기장" />
    <title>우리 모임 · 막차 자기장</title>
    <link rel="manifest" href="../public/manifest.webmanifest" />
    <link rel="icon" href="../public/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../public/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body data-tab="group">
    <main class="page">
      <header class="topbar">
        <h1>우리 모임</h1>
      </header>

      <!-- 로그인 전 -->
      <section class="panel login-prompt" id="guest" hidden>
        <div class="auth-logo" aria-hidden="true">👥</div>
        <h2>모임은 로그인 후에 쓸 수 있어요</h2>
        <p class="hint" id="guest-hint">친구들과 모임방을 만들면 가장 먼저 일어나야 하는 사람에 맞춰 모두에게 알림이 가요.</p>
        <div class="actions">
          <a href="./login.html" class="btn">로그인</a>
          <a href="./signup.html" class="btn btn-primary">회원가입</a>
        </div>
      </section>

      <div id="member-only" hidden>
        <section class="panel">
          <h2>초대 코드로 입장</h2>
          <form id="join-form" class="stack">
            <input type="text" name="code" maxlength="6" inputmode="latin" autocapitalize="characters" autocomplete="off" placeholder="초대 코드 6자리" aria-label="초대 코드" required />
            <button type="submit" class="btn btn-primary btn-block">입장</button>
          </form>
          <p class="err" id="join-error" role="alert"></p>
        </section>

        <section class="panel">
          <h2>새 모임방</h2>
          <p class="hint">방을 만들면 초대 코드가 생겨요. 친구에게 코드를 알려주세요.</p>
          <div class="stack">
            <input type="text" id="place-input" maxlength="40" placeholder="모임 이름이나 장소 (선택)" aria-label="모임 이름이나 장소" />
            <button type="button" class="btn btn-block" id="btn-create-room">모임방 만들기</button>
          </div>
          <p class="err" id="create-error" role="alert"></p>
        </section>
      </div>
    </main>

    <script type="module" src="../src/js/join.js"></script>
  </body>
</html>
