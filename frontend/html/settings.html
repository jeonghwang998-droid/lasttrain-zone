<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0052A4" />
    <title>설정 · 막차 자기장</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <!-- 설정: 여유 시간, 보행 기록 -->
    <main class="page">
      <header class="topbar">
        <a href="/index.html" class="icon-btn" aria-label="뒤로">←</a>
        <h1>설정</h1>
      </header>
      <form id="settings-form" class="form">
        <label>
          여유 시간 (분)
          <input type="number" name="buffer_min" min="0" max="30" value="5" />
        </label>
        <p class="hint" id="walk-speed">보행 속도: 기본값 사용 중</p>
        <button type="submit" class="btn btn-primary">저장</button>
      </form>
    </main>

    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
