<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="막차 자기장" />
    <title>시작하기 · 막차 자기장</title>
    <link rel="manifest" href="../public/manifest.webmanifest" />
    <link rel="icon" href="../public/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../public/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body>
    <!-- 가입 직후: 집 위치 등록, 알림 권한 -->
    <main class="page auth">
      <div class="auth-brand">
        <div class="auth-logo icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></svg></div>
        <h1>집은 어디예요?</h1>
        <p>집을 알아야 막차 시간을 계산할 수 있어요</p>
      </div>

      <form id="onboarding-form" class="form">
        <label>
          집
          <select name="home" id="home"></select>
        </label>
        <p class="hint">집 위치는 나만 볼 수 있어요. 나중에 내 정보에서 바꿀 수 있어요.</p>
        <button type="button" class="btn btn-block" id="btn-push-permission">알림 권한 허용</button>
        <button type="submit" class="btn btn-primary btn-block">완료</button>
      </form>

      <p class="auth-switch"><a href="./dashboard.html" id="skip">나중에 할게요</a></p>
    </main>

    <script type="module" src="../src/js/onboarding.js"></script>
  </body>
</html>
