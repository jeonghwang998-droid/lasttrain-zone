<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0052A4" />
    <title>시작하기 · 막차 자기장</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <!-- 온보딩: 집 위치 등록, 알림 권한 -->
    <main class="page">
      <header class="topbar"><h1>시작하기</h1></header>
      <form id="onboarding-form" class="form">
        <label>
          닉네임
          <input type="text" name="nickname" maxlength="12" required />
        </label>
        <label>
          집 위치
          <input type="text" name="home" placeholder="가까운 역 또는 주소 검색" required />
        </label>
        <button type="button" class="btn" id="btn-push-permission">알림 권한 허용</button>
        <button type="submit" class="btn btn-primary">완료</button>
      </form>
    </main>

    <script type="module" src="/src/onboarding.js"></script>
  </body>
</html>
