<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="막차 자기장" />
    <title>로그인 · 막차 자기장</title>
    <link rel="manifest" href="../public/manifest.webmanifest" />
    <link rel="icon" href="../public/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../public/icons/icon-192.png" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body>
    <main class="page auth">
      <a href="../index.html" class="icon-btn back" aria-label="뒤로">←</a>

      <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">🚇</div>
        <h1>막차 자기장</h1>
        <p>우리 모임이 어디까지 괜찮은지 보여드려요</p>
      </div>

      <p class="notice" id="login-notice" role="status" hidden>가입이 완료되었어요. 로그인해 주세요.</p>

      <form id="login-form" class="form" novalidate>
        <label>
          이메일
          <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required />
        </label>
        <label>
          비밀번호
          <input type="password" name="password" autocomplete="current-password" placeholder="6자 이상" required />
        </label>
        <p class="err" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>

      <p class="auth-switch">아직 계정이 없나요? <a href="./signup.html">회원가입</a></p>
      <p class="auth-switch"><a href="../index.html">소개 페이지로</a></p>
    </main>

    <script type="module" src="../src/js/login.js"></script>
  </body>
</html>
